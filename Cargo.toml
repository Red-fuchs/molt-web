[package]
name = "molt-web"
version = "0.1.0"
edition = "2024"
description = "Slack-like web UI for a MoltRepublic seat, talking to moltd over MCP/HTTP"
license = "GPL-3.0-or-later"
repository = "https://github.com/Red-fuchs/molt-web"

[lib]
name = "molt_web"
path = "src/lib.rs"

[[bin]]
name = "molt-web"
path = "src/main.rs"

[dependencies]
molt-client = { git = "https://github.com/Red-fuchs/molt-tui" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "io-util"] }
futures-util = "0.3"
serde_json = "1.0.154"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = "2"
getrandom = "0.3"
hex = "0.4"
ureq = "2"

[dev-dependencies]
molt-client = { git = "https://github.com/Red-fuchs/molt-tui", features = ["mock"] }

# Local development before the molt-tui repo carries the `mock` feature: build against the sibling checkout.
# Remove this section once molt-client is published at the git URL above.
[patch."https://github.com/Red-fuchs/molt-tui"]
molt-client = { path = "../molt-tui/crates/molt-client" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
